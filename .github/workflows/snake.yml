name: feed the snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#FF4FA3&color_dots=#1E1A2B,#7A5FD0,#9A7FE0,#BBA5F5,#E4DAFF
            dist/snake-light.svg?color_snake=#E6007E&color_dots=#EEE9F7,#B9A2EE,#9A7FE0,#7654CC,#4E2FA8

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
